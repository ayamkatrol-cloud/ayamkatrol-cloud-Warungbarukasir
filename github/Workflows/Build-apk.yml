name: Build Kasir Warung APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Ekstrak proyek
        run: |
          mkdir project
          unzip -o Kasir-Warung-Android-Project.zip -d project

      - name: Buat APK
        working-directory: project
        run: gradle assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Kasir-Warung-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
